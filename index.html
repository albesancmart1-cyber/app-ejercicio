<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!--
      Se fija la escala para que no se pueda ampliar con dos dedos ni con dos
      toques: instalada en el móvil, esto es una app, y en una app el contenido
      no se hace zoom. `viewport-fit=cover` deja que el fondo llegue hasta debajo
      de la barra de estado y del indicador de inicio.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#000000" />
    <title>Ritmo — entrena con tu cuerpo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
