name: Desplegar en GitHub Pages

on:
  push:
    branches: [claude/smart-workout-app-lrleo9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se suben dos cambios seguidos, que gane el último sin cancelar un despliegue a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No publicamos nada que no pase los tests.
      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: /app-ejercicio/
          # Dónde vive la nube, si se ha configurado. Son valores públicos —la
          # clave anónima no abre nada sin sesión, porque la base de datos tiene
          # el aislamiento por filas activado—, así que van como «variables» del
          # repositorio y no como secretos. Si no están, la app se construye
          # igual y guarda solo en el dispositivo.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # ── La cata de interfaz, en /cata/ ──────────────────────────────────
      #
      # Se publica junto a la app para poder mirarla en el móvil sin desplegar
      # una migración a medias en la app de verdad. Pages sirve un solo
      # artefacto, así que la única forma de que convivan es meter una dentro de
      # la otra.
      #
      # Los tres pasos van con `continue-on-error`: una rama de exploración rota
      # no puede impedir que se publique la app. Si algo falla aquí, el
      # despliegue sigue y en /cata/ simplemente no habrá nada.
      - id: hay-cata
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin cata-appica >/dev/null 2>&1; then
            echo "existe=si" >> "$GITHUB_OUTPUT"
          else
            echo "existe=no" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.hay-cata.outputs.existe == 'si'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: cata-appica
          path: cata

      - if: steps.hay-cata.outputs.existe == 'si'
        continue-on-error: true
        name: Construir la cata y colgarla de /cata/
        run: |
          cd cata
          npm ci
          # PWA=off: dos service workers anidados en el mismo origen se pisan.
          PWA=off BASE_PATH=/app-ejercicio/cata/ npm run build
          cd ..
          cp -r cata/dist dist/cata

      # enablement activa Pages por API si aún no lo está, en vez de fallar con
      # un «Not Found» y dejar la URL en 404 esperando un clic manual.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
