name: Desplegar en GitHub Pages

on:
  push:
    branches: [claude/smart-workout-app-lrleo9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se suben dos cambios seguidos, que gane el último sin cancelar un despliegue a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No publicamos nada que no pase los tests.
      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: /app-ejercicio/
          # Dónde vive la nube, si se ha configurado. Son valores públicos —la
          # clave de la API web de Firebase identifica al proyecto y no autoriza
          # nada; lo que protege los datos son las reglas de Firestore—, así que
          # van como «variables» del repositorio y no como secretos. Si no
          # están, la app se construye igual y guarda solo en el dispositivo.
          #
          # Ojo si se usan a la vez este despliegue y el de Netlify: son dos
          # dominios distintos, y los dos tienen que estar en la lista de
          # dominios autorizados de Firebase o el enlace del correo no se manda.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}

      # enablement activa Pages por API si aún no lo está, en vez de fallar con
      # un «Not Found» y dejar la URL en 404 esperando un clic manual.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
